syntax = "proto3";
package GateLoginCmd;
option optimize_for = LITE_RUNTIME;


enum GateLoginMsgID 
{
	GG_LS_Null                   = 0;
	
	GG_LS_Login_REQ              = 1;
	LS_GG_Login_ACK              = 2;
	GG_LS_Logoff_NTF             = 3;
	LS_GG_Kickoff_NTF            = 4;
	GG_LS_ReportPlayerNum_NTF    = 5;
	GG_LS_SetPasswordTemp_REQ    = 6;
	LS_GG_SetPasswordTemp_ACK    = 7;	
}


message PKG_GG_LS_Login_REQ
{
	string AuthAct = 1;
	string AuthStr = 2;
	uint32 APType = 3;
	uint32 ClientVersion = 4;
	uint32 ClientType = 5;
	uint32 AreaGroup = 6;
	uint32 Ip = 7;
	string InviteCode = 8;
	uint32 Reserve = 9;
}


message PKG_LS_GG_Login_ACK
{
	uint32 Result = 1;
	string PTID = 2;
	uint32 wPlatType = 3;// loginInfo
	string abyDataInfo = 4;// loginData
	uint32 error = 5;
}
		
message PKG_GG_LS_Logoff_NTF
{
	string PTID = 1;
}

message PKG_LS_GG_Kickoff_NTF
{
	string PTID = 1;
}
